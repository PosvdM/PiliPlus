name: Sync BiliBreeze prompts

# BiliBreeze (PosvdM/bili-breeze) is the upstream for the classification
# prompts. Prompt-only changes are committed to feat/bili-breeze; changes
# that the Dart port no longer matches go to sync/breeze-prompts and fail.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Branch to sync (for testing the workflow)"
        default: feat/bili-breeze

env:
  TARGET: ${{ inputs.target || 'feat/bili-breeze' }}

permissions:
  contents: write

concurrency:
  group: sync-breeze-prompts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PiliPlus
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
          fetch-depth: 0
          path: piliplus

      - name: Checkout BiliBreeze
        uses: actions/checkout@v7
        with:
          repository: PosvdM/bili-breeze
          ref: main
          # The sync records the last commit touching prompts/.
          fetch-depth: 0
          path: bili-breeze

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync prompts
        id: sync
        working-directory: piliplus
        run: |
          node .github/scripts/sync-breeze-prompts.cjs ../bili-breeze . | tee sync.log
          if git diff --quiet -- lib/services/breeze/breeze_prompts.dart test/services/breeze_prompt_fixtures.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "summary=$(cat sync.log)" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      - name: Setup Flutter
        if: steps.sync.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: piliplus/pubspec.yaml

      - name: Check the Dart port
        id: test
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        working-directory: piliplus
        run: |
          flutter pub get
          flutter test test/services/breeze_rules_test.dart

      - name: Commit
        if: steps.sync.outputs.changed == 'true'
        working-directory: piliplus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/breeze/breeze_prompts.dart
          git add -f test/services/breeze_prompt_fixtures.json
          git commit -m "chore(breeze): ${{ steps.sync.outputs.summary }}"

      - name: Push
        if: steps.sync.outputs.changed == 'true' && steps.test.outcome == 'success'
        working-directory: piliplus
        run: git push origin "HEAD:$TARGET"

      # Keep the Android test build branch on top of the feature.
      - name: Rebase test/android-dev
        if: steps.sync.outputs.changed == 'true' && steps.test.outcome == 'success' && env.TARGET == 'feat/bili-breeze'
        working-directory: piliplus
        run: |
          if git ls-remote --exit-code --heads origin test/android-dev > /dev/null; then
            git fetch origin feat/bili-breeze test/android-dev
            git checkout -B test/android-dev origin/test/android-dev
            git rebase origin/feat/bili-breeze
            git push --force-with-lease origin test/android-dev
          fi

      - name: Needs a manual port
        if: steps.sync.outputs.changed == 'true' && steps.test.outcome != 'success'
        working-directory: piliplus
        run: |
          git push --force origin HEAD:sync/breeze-prompts
          echo "::error::BiliBreeze changed request logic that the Dart port does not match. See branch sync/breeze-prompts."
          exit 1
